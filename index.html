    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: #1a2331; /* Azul escuro sólido */
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.3s, color 0.3s;
        }

        body.light {
            background: #e6f0ff; /* Azul claro sólido */
            color: #000000;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        body.light .overlay {
            background: rgba(255, 255, 255, 0.2);
        }

        header {
            width: 100%;
            padding: 20px;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        body.light header {
            background: rgba(245, 245, 245, 0.7);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .logo {
            width: 150px;
        }

        .theme-toggle {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.3s, transform 0.2s ease, color 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        body.dark .theme-toggle {
            background: rgba(20, 20, 20, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        body.light .theme-toggle {
            background: rgba(245, 245, 245, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #000000;
        }

        .theme-toggle:hover {
            transform: translateY(-50%) scale(1.05);
        }

        body.dark .theme-toggle:hover {
            background: rgba(20, 20, 20, 0.9);
        }

        body.light .theme-toggle:hover {
            background: rgba(245, 245, 245, 0.9);
        }

        #app {
            max-width: 800px;
            margin: 120px auto 100px;
            padding: 20px;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        body.light #app {
            background: rgba(245, 245, 245, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(50, 50, 50, 0.8);
            color: #fff;
            outline: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        body.light input {
            background: rgba(0, 0, 0, 0.1);
            color: #000000;
        }

        input:focus {
            background: rgba(60, 60, 60, 0.9);
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
        }

        body.light input:focus {
            background: rgba(0, 0, 0, 0.2);
        }

        button[type="submit"] {
            padding: 12px 24px;
            background: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            display: ruby;
        }

        button[type="submit"]:hover {
            background: #0056b3;
            transform: scale(1.05);
        }

        button[type="submit"]:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .download-link {
            display: block;
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: #ffffff;
            text-align: center;
            border-radius: 10px;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s ease;
            font-weight: 500;
            font-size: 20px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .download-link:hover {
            background: #218838;
            transform: scale(1.05);
        }

        .progress-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar div {
            height: 100%;
            background: #28a745;
            transition: width 0.3s ease;
        }

        .status {
            text-align: center;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .player {
            max-width: 480px;
            width: 100%;
            margin: 0 auto 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            background: rgba(20, 20, 20, 0.7);
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.light table {
            background: rgba(245, 245, 245, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        thead {
            background: #007bff;
            color: #ffffff;
        }

        th {
            padding: 10px;
            text-align: left;
            font-size: 12px;
        }

        tr:nth-child(even) {
            background: rgba(30, 50, 50, 0.5);
        }

        body.light tr:nth-child(even) {
            background: rgba(0, 0, 0, 0.05);
        }

        tr:nth-child(odd) {
            background: rgba(20, 20, 20, 0.7);
        }

        body.light tr:nth-child(odd) {
            background: rgba(245, 245, 245, 0.7);
        }

        td {
            padding: 10px;
        }

        td a {
            color: #007bff;
            text-decoration: none;
        }

        td a:hover {
            text-decoration: underline;
        }

        td button {
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s ease;
        }

        td button:first-child {
            background: #007bff;
            color: #ffffff;
            border: none;
            margin-right: 5px;
        }

        td button:first-child:hover {
            background: #0056b3;
            transform: scale(1.05);
        }

        td button:last-child {
            background: #dc3545;
            color: #ffffff;
            border: none;
        }

        td button:last-child:hover {
            background: #c82333;
            transform: scale(1.05);
        }

        .footer {
            padding: 10px;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            width: 100%;
            position: fixed;
            bottom: 0;
            z-index: 2;
            text-align: center;
            font-size: 12px;
        }

        body.dark .footer {
            background: rgba(20, 20, 20, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: none;
        }

        body.light .footer {
            background: rgba(245, 245, 245, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-bottom: none;
        }

        .footer p {
            color: #d0d0d0;
        }

        body.light .footer p {
            color: #666666;
        }


        @media (max-width: 768px) {
            #app {
                margin: 120px auto 100px;
                padding: 15px;
            }

            form {
                flex-direction: column;
            }

            button[type="submit"] {
                width: 100%;
            }

            .player {
                max-width: 100%;
            }
        }
    </style>
</head>
<body class="dark">
    <div class="overlay"></div>
    <header>
        <a href=""><img class="logo" src="img/logo.png" alt="logo"></a>
        <button class="theme-toggle" onclick="toggleTheme()">Light</button>
    </header>
    <div id="app">
        <p class="text-center mb-6">
            <strong>Download Bluesky videos!</strong> Enter a Bluesky video post URL:
        </p>
        <form @submit.prevent="processVideo">
            <input
                v-model="postUrl"
                type="text"
                placeholder="https://bsky.app/profile/user.bsky.social/post/aEzakMi2004"
                required
            />
            <button type="submit" :disabled="status.length > 0">
                <svg fill="#fff" height="20px" width="20px" viewBox="0 0 29.978 29.978">
                    <g>
                        <path d="M25.462,19.105v6.848H4.515v-6.848H0.489v8.861c0,1.111,0.9,2.012,2.016,2.012h24.967c1.115,0,2.016-0.9,2.016-2.012 v-8.861H25.462z"/>
                        <path d="M14.62,18.426l-5.764-6.965c0,0-0.877-0.828,0.074-0.828s3.248,0,3.248,0s0-0.557,0-1.416c0-2.449,0-6.906,0-8.723 c0,0-0.129-0.494,0.615-0.494c0.75,0,4.035,0,4.572,0c0.536,0,0.524,0.416,0.524,0.416c0,1.762,0,6.373,0,8.742 c0,0.768,0,1.266,0,1.266s1.842,0,2.998,0c1.154,0,0.285,0.867,0.285,0.867s-4.904,6.51-5.588,7.193 C15.092,18.979,14.62,18.426,14.62,18.426z"/>
                    </g>
                </svg>
                LOAD
            </button>
        </form>
        <div v-if="downloadReady">
            <a :href="downloadLink" class="download-link" :download="`${postCid}.mp4`">Download (.mp4)</a>
        </div>
        <div v-if="progressBarVisible" class="progress-bar">
            <div :style="{ width: progress + '%' }"></div>
        </div>
        <div v-if="status" class="status">{{ status }}</div>
        <div v-if="videoPreviewVisible" class="py-4">
            <video :key="postCid" controls class="player" preload="metadata">
                <source :src="downloadLink" type="video/mp4" />
            </video>
        </div>
        <div v-if="urlHistory.length > 0">
            <table>
                <thead>
                    <tr>
                        <th colspan="2">History</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(url, index) in urlHistory" :key="index">
                        <td>
                            <a :href="url" target="_blank" rel="noopener">{{ url }}</a>
                        </td>
                        <td>
                            <button @click="fillAndDownload(url)">Download</button>
                            <button @click="removeFromHistory(url)">Remove</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <footer class="footer">
        <p>This site does not use any cookies or collect any data. This site is not related to Bluesky.</p>
    </footer>

    <script>
        function toggleTheme() {
            const body = document.body;
            const button = document.querySelector('.theme-toggle');
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                body.classList.add('light');
                button.textContent = 'Dark';
            } else {
                body.classList.remove('light');
                body.classList.add('dark');
                button.textContent = 'Light';
            }
        }

        const { createFFmpeg, fetchFile } = FFmpeg;

        Vue.createApp({
            data() {
                return {
                    ffmpeg: null,
                    postUrl: "",
                    postCid: "",
                    status: "",
                    progress: 0,
                    progressBarVisible: false,
                    videoPreviewVisible: false,
                    downloadReady: false,
                    downloadLink: "",
                    urlHistory: [],
                    subtitleLang: "",
                    subtitleUrl: "",
                };
            },
            async mounted() {
                this.loadHistory();
                this.ffmpeg = createFFmpeg({ log: false, progress: ({ ratio }) => { this.progress = parseInt((ratio * 100).toFixed(2) / 2) + 50; } });
                const urlParams = new URLSearchParams(window.location.search);
                const url = urlParams.get("url");
                if (url) {
                    this.postUrl = url;
                    this.processVideo();
                }
                if (!this.ffmpeg.isLoaded()) await this.ffmpeg.load();
            },
            methods: {
                loadHistory() { this.urlHistory = JSON.parse(localStorage.getItem("urlHistory")) || []; },
                saveToHistory(url) {
                    const existingIndex = this.urlHistory.indexOf(url);
                    if (existingIndex !== -1) this.urlHistory.splice(existingIndex, 1);
                    this.urlHistory.unshift(url);
                    if (this.urlHistory.length > 20) this.urlHistory.pop();
                    localStorage.setItem("urlHistory", JSON.stringify(this.urlHistory));
                },
                removeFromHistory(url) { this.urlHistory = this.urlHistory.filter(item => item !== url); localStorage.setItem("urlHistory", JSON.stringify(this.urlHistory)); },
                fillAndDownload(url) { this.postUrl = url; this.processVideo(); },
                async processVideo() {
                    this.resetState();
                    const postUrl = this.postUrl;
                    this.status = "Initializing...";
                    this.downloadLink = "";
                    this.downloadReady = false;
                    this.videoPreviewVisible = false;
                    try {
                        const { profile, post } = this.extractProfileAndPost(postUrl);
                        const threadRes = await fetch(`https://public.api.bsky.app/xrpc/app.bsky.feed.getPostThread?uri=at://${profile}/app.bsky.feed.post/${post}&depth=10`);
                        const data = await threadRes.json();
                        this.postCid = data.thread.post.cid;
                        let playlistUrl = data.thread.post.embed["$type"] === "app.bsky.embed.video#view" ? data.thread.post.embed.playlist : data.thread.post.embed["$type"] === "app.bsky.embed.recordWithMedia#view" ? data.thread.post.embed.media.playlist : null;
                        this.status = "Downloading...";
                        this.progressBarVisible = true;
                        const videoBlob = await this.proccessPlaylist(playlistUrl);
                        this.status = "Processing...";
                        this.progress = 60;
                        this.ffmpeg.FS("writeFile", "input.ts", await fetchFile(videoBlob));
                        this.status = "Converting to mp4...";
                        this.progress = 80;
                        await this.ffmpeg.run("-i", "input.ts", "-map", "0", "-c", "copy", `video-${post}.mp4`);
                        this.progress = 100;
                        const videoData = this.ffmpeg.FS("readFile", `video-${post}.mp4`);
                        const mp4Blob = new Blob([videoData.buffer], { type: "video/mp4" });
                        this.downloadLink = URL.createObjectURL(mp4Blob);
                        this.downloadReady = true;
                        this.progressBarVisible = false;
                        this.videoPreviewVisible = true;
                        this.status = "";
                        this.saveToHistory(this.postUrl);
                    } catch (error) {
                        this.status = error.message || "An error occurred. Please try again.";
                        if (this.status === "Out of memory") this.status = "Your device is out of memory to convert the file. Please close other tabs and/or apps and try again later.";
                    }
                },
                extractProfileAndPost(postUrl) {
                    const regex = /profile\/([^\/]+)\/post\/([^\/]+)/;
                    const matches = postUrl.match(regex);
                    if (!matches) throw new Error("Invalid URL format");
                    return { profile: matches[1], post: matches[2] };
                },
                async proccessPlaylist(playlistUrl) {
                    const masterPlaylistResponse = await fetch(playlistUrl);
                    const masterPlaylist = await masterPlaylistResponse.text();
                    await this.setSubtitleUrl(playlistUrl, this.extractSubtitleLang(masterPlaylist));
                    const videoPlaylistUrl = this.parseHighestQualityVideoUrl(masterPlaylist, playlistUrl);
                    const videoPlaylistResponse = await fetch(videoPlaylistUrl);
                    const videoPlaylist = await videoPlaylistResponse.text();
                    const segmentUrls = this.parseSegmentUrls(videoPlaylist, videoPlaylistUrl);
                    return this.downloadSegments(segmentUrls);
                },
                extractSubtitleLang(m3u8Content) {
                    const lines = m3u8Content.split("\n");
                    for (const line of lines) {
                        if (line.startsWith("#EXT-X-MEDIA") && line.includes("TYPE=SUBTITLES")) {
                            const langMatch = line.match(/LANGUAGE="([^"]+)"/);
                            if (langMatch) return langMatch[1];
                        }
                    }
                    return null;
                },
                async setSubtitleUrl(playlistUrl, lang) {
                    this.subtitleLang = lang;
                    if (lang) this.subtitleUrl = await this.convertUrlToBlobUrl(`${playlistUrl.replace("playlist.m3u8", "")}subtitles/${lang}.vtt`);
                },
                parseHighestQualityVideoUrl(masterPlaylist, baseUrl) {
                    let highestBandwidth = 0;
                    let highestQualityUrl = "";
                    masterPlaylist.split("\n").forEach((line, i, lines) => {
                        if (line.startsWith("#EXT-X-STREAM-INF")) {
                            const bandwidth = parseInt(line.match(/BANDWIDTH=(\d+)/)[1]);
                            if (bandwidth > highestBandwidth) {
                                highestBandwidth = bandwidth;
                                highestQualityUrl = lines[i + 1];
                            }
                        }
                    });
                    return new URL(highestQualityUrl, baseUrl).toString();
                },
                parseSegmentUrls(videoPlaylist, baseUrl) {
                    return videoPlaylist.split("\n").filter(line => !line.startsWith("#") && line.trim() !== "").map(segment => new URL(segment, baseUrl).toString());
                },
                async downloadSegments(segmentUrls) {
                    const chunks = [];
                    for (let i = 0; i < segmentUrls.length; i++) {
                        const response = await fetch(segmentUrls[i]);
                        chunks.push(await response.arrayBuffer());
                        this.progress = ((i + 1) / segmentUrls.length) * 50;
                    }
                    return new Blob(chunks, { type: "video/MP2T" });
                },
                async convertUrlToBlobUrl(url) {
                    try {
                        const response = await fetch(url);
                        if (!response.ok) throw new Error(`Failed to fetch data from URL: ${response.statusText}`);
                        const blob = await response.blob();
                        return URL.createObjectURL(blob);
                    } catch (error) {
                        console.error("Error converting URL to Blob URL:", error);
                    }
                },
                resetState() {
                    this.status = "";
                    this.progress = 0;
                    this.progressBarVisible = false;
                    this.videoPreviewVisible = false;
                    this.downloadReady = false;
                    this.downloadLink = "";
                    this.subtitleLang = "";
                    this.subtitleUrl = "";
                    this.postCid = "";
                },
            },
        }).mount("#app");
    </script>
